  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tom: 1px solid rgba(12,74,110,0.1);\">\n                      <span style=\"flex: none; width: 26px; height: 26px; border-radius: 50%; background: #15894f; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;\">✓<\u002Fspan>\n                      <span style=\"color: #0b2540; text-wrap: pretty; padding-top: 1px;\">Công dân Việt Nam hoặc người nước ngoài cư trú hợp pháp tại Việt Nam.<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display: flex; gap: 16px; align-items: flex-start; padding: 16px 0; border-bottom: 1px solid rgba(12,74,110,0.1);\">\n                      <span style=\"flex: none; width: 26px; height: 26px; border-radius: 50%; background: #15894f; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;\">✓<\u002Fspan>\n                      <span style=\"color: #0b2540; text-wrap: pretty; padding-top: 1px;\">Có tên trên vé máy bay của chuyến bay được bảo hiểm.<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display: flex; gap: 16px; align-items: flex-start; padding: 16px 0; border-bottom: 1px solid rgba(12,74,110,0.1);\">\n                      <span style=\"flex: none; width: 26px; height: 26px; border-radius: 50%; background: #15894f; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;\">✓<\u002Fspan>\n                      <span style=\"color: #0b2540; text-wrap: pretty; padding-top: 1px;\">Trẻ em dưới 12 tuổi phải đi cùng người từ 18 tuổi trở lên, được bảo hiểm trong cùng một Hợp đồng / Giấy chứng nhận bảo hiểm.<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ dtDefs }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 16px;\">\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"12\" cy=\"7\" r=\"4\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">01<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Người được bảo hiểm<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là cá nhân có tên trong Hợp đồng bảo hiểm/Giấy chứng nhận bảo hiểm, đáp ứng điều kiện tham gia bảo hiểm nêu tại mục 1, Phần II Quy tắc bảo hiểm này, được hưởng quyền lợi theo Hợp đồng bảo hiểm/Giấy chứng nhận bảo hiểm. Người được bảo hiểm có thể đồng thời là người thụ hưởng.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\"><\u002Fpath><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"><\u002Fpath><path d=\"m9 15 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">02<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Bên mua bảo hiểm/Chủ Hợp đồng bảo hiểm<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là tổ chức, cá nhân ký kết Hợp đồng bảo hiểm với Bảo hiểm PVI và đóng phí bảo hiểm. Bên mua bảo hiểm có thể đồng thời là Người được bảo hiểm hoặc người thụ hưởng.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\"><\u002Fpath><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"><\u002Fpath><path d=\"M16 13H8M16 17H8M10 9H8\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">03<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Hợp đồng bảo hiểm<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là thoả thuận giữa Bên mua bảo hiểm và Bảo hiểm PVI, phù hợp với quy định của pháp luật, theo đó bên mua bảo hiểm phải đóng phí bảo hiểm và Bảo hiểm PVI cung cấp dịch vụ bảo hiểm theo Quy tắc bảo hiểm này.\nBộ Hợp đồng bảo hiểm bao gồm: Giấy yêu cầu bảo hiểm, bản Hợp đồng bảo hiểm, Giấy chứng nhận bảo hiểm, Quy tắc bảo hiểm, Bảng quyền lợi bảo hiểm và những giấy tờ liên quan khác.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">04<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Người thụ hưởng<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là tổ chức/cá nhân được Bên mua bảo hiểm/Người được bảo hiểm chỉ định nhận tiền bảo hiểm theo Hợp đồng/Giấy chứng nhận bảo hiểm phù hợp với quy định của pháp luật, hoặc là người thừa kế theo quy định của pháp luật trong trường hợp không có chỉ định theo Hợp đồng/Giấy chứng nhận bảo hiểm.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"><\u002Frect><path d=\"M16 2v4M8 2v4M3 10h18\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">05<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Tuổi của Người được bảo hiểm<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Được tính theo năm dương lịch (tính từ năm sinh theo giấy khai sinh hoặc Căn cước/Căn cước công dân hoặc hộ chiếu) tại thời điểm tham gia bảo hiểm.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"20\" height=\"12\" x=\"2\" y=\"6\" rx=\"2\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"2\"><\u002Fcircle><path d=\"M6 12h.01M18 12h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">06<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Số tiền bảo hiểm<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là số tiền tối đa được ghi trong Bảng quyền lợi bảo hiểm mà Bảo hiểm PVI có thể chi trả trong thời hạn bảo hiểm cho Người được bảo hiểm hoặc Người thụ hưởng hợp pháp khi xảy ra sự kiện bảo hiểm.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">07<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Sự kiện bảo hiểm<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là sự kiện khách quan được quy định trong mục Phạm vi bảo hiểm của Quy tắc bảo hiểm này mà khi sự kiện đó xảy ra thì Bảo hiểm PVI phải trả tiền bảo hiểm cho Người được bảo hiểm hoặc Người thụ hưởng.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">08<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Hãng hàng không<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là các doanh nghiệp kinh doanh vận chuyển hàng không hợp pháp tại Việt Nam, bao gồm cả các Hãng hàng không nước ngoài được phép khai thác chuyến bay đến/đi từ Việt Nam.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z\"><\u002Fpath><path d=\"M13 5v2M13 17v2M13 11v2\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">09<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Vé máy bay<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là bất kỳ vé máy bay được mua cho Chuyến đi của Người được bảo hiểm do Hãng hàng không phát hành. Thời gian khởi hành, Nơi khởi hành và Nơi đến phải được ghi trong Vé máy bay của Chuyến bay theo lịch trình của Người được bảo hiểm.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 9h16M4 15h16M10 3 8 21M16 3l-2 18\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">10<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Mã đặt chỗ<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Một dãy ký tự gồm chữ và/hoặc số do Hãng hàng không cấp, dùng để xác nhận và quản lý thông tin đặt vé của hành khách.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"><\u002Frect><path d=\"M16 2v4M8 2v4M3 10h18\"><\u002Fpath><path d=\"M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">11<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Chuyến bay theo lịch trình<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là các chuyến bay thương mại được xếp lịch bởi Hãng hàng không với thông tin chi tiết chuyến bay được nêu rõ trong lịch trình bay của Người được bảo hiểm và luôn luôn được hiểu rằng, tại mọi thời điểm, Hãng hàng không đã có điều kiện cần thiết và các giấy phép hợp lệ hoặc được quyền tương tự cho việc vận chuyển hàng không theo lịch trình.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m16 3 4 4-4 4\"><\u002Fpath><path d=\"M20 7H4\"><\u002Fpath><path d=\"m8 21-4-4 4-4\"><\u002Fpath><path d=\"M4 17h16\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">12<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Chuyến bay thay thế<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là chuyến bay do Hãng hàng không thu xếp cho Người được bảo hiểm, thay thế Chuyến bay được bảo hiểm ban đầu bị trễ/hủy chuyến và có cùng Nơi đi, Nơi đến, Mã đặt chỗ với Chuyến bay được bảo hiểm. Trong mọi trường hợp, Chuyến bay thay thế không được thu xếp theo yêu cầu của Bên mua bảo hiểm/Người được bảo hiểm.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">13<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Chuyến bay được bảo hiểm<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là Chuyến bay theo lịch trình của Người được bảo hiểm trong lãnh thổ Việt Nam hoặc xuất phát từ Việt Nam, được ghi nhận trên Hợp đồng bảo hiểm/Giấy chứng nhận bảo hiểm.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5\"><\u002Fpath><path d=\"M16 2v4M8 2v4M3 10h5\"><\u002Fpath><path d=\"M17.5 17.5 16 16.3V14\"><\u002Fpath><circle cx=\"16\" cy=\"16\" r=\"6\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">14<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Thời gian khởi hành theo lịch trình<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">(i) Là thời gian khởi hành ban đầu của chuyến bay như đã nêu trên Vé máy bay tại thời điểm mua; hoặc\n(ii) Thời gian khởi hành được cập nhật từ Hãng hàng không ít nhất 24 giờ trước thời gian khởi hành ban đầu\ntùy thời gian nào đến sau sẽ được áp dụng.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 22h20\"><\u002Fpath><path d=\"M6.36 17.4 4 17l-2-4 1.1-.55a2 2 0 0 1 1.8 0l.17.1a2 2 0 0 0 1.8 0L8 12 5 6l.9-.45a2 2 0 0 1 2.09.2l4.02 3a2 2 0 0 0 2.1.2l4.19-2.06a2.41 2.41 0 0 1 1.73-.17L21 7a1.4 1.4 0 0 1 .87 1.99l-.38.76c-.23.46-.6.84-1.07 1.08L7.58 17.2a2 2 0 0 1-1.22.18Z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">15<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Thời gian khởi hành thực tế<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là thời điểm máy bay bắt đầu lăn bánh di chuyển ra đường bay để cất cánh, căn cứ vào số liệu công bố thực tế của Tổ chức cung cấp dữ liệu chuyến bay theo quy định trong Hợp đồng bảo hiểm/Giấy chứng nhận bảo hiểm.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 10c0 4.99-5.54 10.19-7.4 11.8a1 1 0 0 1-1.2 0C9.54 20.19 4 14.99 4 10a8 8 0 0 1 16 0\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">16<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Nơi đi<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là địa điểm xuất phát đầu tiên của Chuyến bay theo lịch trình của Người được bảo hiểm, được ghi rõ trên Vé máy bay và trong Hợp đồng bảo hiểm/Giấy chứng nhận bảo hiểm.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z\"><\u002Fpath><path d=\"M4 22v-7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">17<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Nơi đến<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là địa điểm nơi mà Chuyến bay theo lịch trình của Người được bảo hiểm đã được định sẵn để khởi hành đến, được ghi rõ trên Vé máy bay và trong Hợp đồng bảo hiểm/Giấy chứng nhận bảo hiểm.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 22h18M6 18v-7M10 18v-7M14 18v-7M18 18v-7M12 2l8 5H4z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">18<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Sân bay Khởi hành<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là sân bay tại Việt Nam nơi Người được bảo hiểm bắt đầu chiều đi của chuyến bay một chiều hoặc chuyến bay khứ hồi, và sân bay tại Nơi đến, nơi Người được bảo hiểm bắt đầu chiều về của chuyến bay khứ hồi.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"><\u002Frect><path d=\"M16 2v4M8 2v4M3 10h18\"><\u002Fpath><path d=\"m9 16 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">19<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Ngày khởi hành đầu tiên<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là ngày mà Người được bảo hiểm sẽ khởi hành theo lịch quy định trên Vé máy bay của Người được bảo hiểm.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><ellipse cx=\"12\" cy=\"5\" rx=\"9\" ry=\"3\"><\u002Fellipse><path d=\"M3 5v14a9 3 0 0 0 18 0V5\"><\u002Fpath><path d=\"M3 12a9 3 0 0 0 18 0\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">20<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Tổ chức cung cấp dữ liệu chuyến bay<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là tổ chức cung cấp dữ liệu trực tuyến liên quan đến hoạt động hàng không được Bảo hiểm PVI chỉ định và được Bên mua bảo hiểm chấp thuận theo Hợp đồng bảo hiểm/Giấy chứng nhận bảo hiểm.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 22h14M5 2h14\"><\u002Fpath><path d=\"M17 22v-4.17a2 2 0 0 0-.59-1.42L12 12l-4.41 4.41A2 2 0 0 0 7 17.83V22\"><\u002Fpath><path d=\"M7 2v4.17a2 2 0 0 0 .59 1.42L12 12l4.41-4.41A2 2 0 0 0 17 6.17V2\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">21<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Trễ chuyến bay<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là trường hợp Thời gian khởi hành thực tế của Chuyến bay được bảo hiểm bị trễ so với Thời gian khởi hành theo lịch trình.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"8\" height=\"4\" x=\"8\" y=\"2\" rx=\"1\"><\u002Frect><path d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\"><\u002Fpath><path d=\"m9 14 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">22<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Đăng ký lên máy bay<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là việc Người được bảo hiểm đăng ký tên lên chuyến bay trong Ngày khởi hành đầu tiên của Chuyến bay theo lịch trình.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">23<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Nội chiến<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">là chiến tranh giữa các thành phần trong một quốc gia, giữa những người đồng bào cùng ngôn ngữ nhưng tranh chấp vì nhiều lý do khác nhau: tôn giáo, chính trị, kinh tế theo công bố của cơ quan nhà nước có thẩm quyền.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m3 11 18-5v12L3 14v-3z\"><\u002Fpath><path d=\"M11.6 16.8a3 3 0 1 1-5.8-1.6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">24<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Gây rối và bạo động<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là hành động chống phá bằng bạo lực có tổ chức nhằm gây rối loạn an ninh chính trị, trật tự an toàn xã hội hoặc lật đổ chính quyền. Gây rối và bạo động được xác định theo công bố của cơ quan nhà nước có thẩm quyền.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"><\u002Fpath><path d=\"M12 8v4M12 16h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                      <span style=\"font-size: 12px; color: #0369a1; letter-spacing: 0.08em;\">25<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 17px; font-weight: 600; color: #0b2540; line-height: 1.3; text-wrap: pretty;\">Không tặc<\u002Fdiv>\n                    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #3d5a76; text-wrap: pretty; white-space: pre-line;\">Là các hành động chiếm đoạt hoặc kiểm soát máy bay bằng vũ lực hoặc bạo lực hoặc đe dọa bằng vũ lực hoặc bạo lực, và với ý định sai trái.<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(12,74,110,0.14); border-radius: 12px; background: rgba(255,255,255,0.7); padding: 22px; display: flex; flex-direction: column; gap: 12px; transition: border-color 200ms, transform 200ms;\" style-hover=\"border-color: #15894f; transform: translateY(-2px);\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px;\">\n                      <span style=\"width: 44px; height: 44px; border-radius: 10px; background: #e7f5ed; display: flex; align-items: center; justify-content: center;\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#15894f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"><\u002Fpath><path d=\"M12 9v4M1

ểm', d: 'Cá nhân có tên trong Hợp đồng / Giấy chứng nhận bảo hiểm, đáp ứng điều kiện tham gia và được hưởng quyền lợi; có thể đồng thời là người thụ hưởng.' },\n        { t: 'Bên mua bảo hiểm', d: 'Tổ chức / cá nhân ký kết Hợp đồng bảo hiểm với Bảo hiểm PVI và đóng phí bảo hiểm.' },\n        { t: 'Số tiền bảo hiểm', d: 'Số tiền tối đa ghi trong Bảng quyền lợi mà Bảo hiểm PVI có thể chi trả khi xảy ra sự kiện bảo hiểm: 1.000.000 VND / chuyến / người.' },\n        { t: 'Chuyến bay được bảo hiểm', d: 'Chuyến bay theo lịch trình đặt qua Gotadi, được ghi nhận trên Hợp đồng / Giấy chứng nhận bảo hiểm.' },\n        { t: 'Thời gian khởi hành theo lịch trình', d: 'Thời gian khởi hành ban đầu trên Vé máy bay tại thời điểm mua; hoặc thời gian cập nhật từ Hãng ít nhất 24 giờ trước giờ khởi hành ban đầu, tùy thời gian nào đến sau.' },\n        { t: 'Thời gian khởi hành thực tế', d: 'Thời điểm máy bay bắt đầu lăn bánh ra đường bay để cất cánh, căn cứ số liệu công bố của Tổ chức cung cấp dữ liệu chuyến bay.' },\n        { t: 'Trễ chuyến bay', d: 'Thời gian khởi hành thực tế của Chuyến bay được bảo hiểm bị trễ so với Thời gian khởi hành theo lịch trình.' },\n        { t: 'Chuyến bay thay thế', d: 'Chuyến bay do Hãng hàng không thu xếp thay thế Chuyến bay được bảo hiểm bị trễ / hủy, cùng Nơi đi, Nơi đến, Mã đặt chỗ; không thu xếp theo yêu cầu của Bên mua / Người được bảo hiểm.' }\n      ];\nconst DOCS = [\n        { n: '01', t: 'CMND/CCCD hoặc Hộ chiếu', d: 'Ảnh chụp rõ nét của hành khách đang khai báo.' },\n        { n: '02', t: 'Thông báo thay đổi / hoãn / hủy chuyến', d: 'Thông báo chính thức từ Hãng hàng không.' },\n        { n: '03', t: 'Thẻ lên máy bay (boarding pass)', d: 'Của chuyến bay ban đầu, đúng hành khách đang khai báo.' },\n        { n: '04', t: 'Tài khoản ngân hàng', d: 'Để nhận tiền bồi thường.' },\n        { n: '05', t: 'Email đã đăng ký', d: 'Email liên kết hợp đồng, dùng nhận mã OTP đăng nhập.' }\n      ];\nconst STEPS = [\n        { img: 'assets/claims/image1.png', n: '01', t: 'Nhận email thông báo', d: 'PVI gửi email khi chuyến bay đủ điều kiện, kèm mã hồ sơ và link vào Cổng.' },\n        { img: 'assets/claims/image2.png', n: '02', t: 'Đăng nhập bằng email & OTP', d: 'Nhập email đã liên kết hợp đồng, bấm “Đồng ý và tiếp tục”, rồi nhập mã OTP gửi về hộp thư.' },\n        { img: 'assets/claims/image4.png', n: '03', t: 'Mở “Bảo hiểm của tôi”', d: 'Chọn hợp đồng cần bồi thường, bấm “Xem thêm” để mở chi tiết.' },\n        { img: 'assets/claims/image6.png', n: '04', t: 'Chọn quyền lợi bồi thường', d: 'Bấm “Yêu cầu bồi thường” ở cuối trang, chọn Chuyến bay ban đầu hoặc Chuyến bay thay thế.' },\n        { img: 'assets/claims/image7.png', n: '05', t: 'Điền hồ sơ & tải chứng từ', d: 'Khai tài khoản nhận tiền và thông tin chuyến bay mới, tải giấy tờ, xác nhận 3 cam kết rồi bấm “Gửi”.' },\n        { img: 'assets/claims/image14.png', n: '06', t: 'Theo dõi & nhận tiền', d: 'Xem trạng thái tại “Các yêu cầu bồi thường”. Tiền chuyển về tài khoản sau khi hồ sơ được duyệt.' }\n      ];\nconst STATUSES = [\n        { n: '01', t: 'Đang xử lý', d: 'Hồ sơ đã nộp thành công và đang được thẩm định.' },\n        { n: '02', t: 'Đang xử lý thanh toán', d: 'Hồ sơ đã được phê duyệt, đang chi trả về tài khoản.' },\n        { n: '03', t: 'Hoàn tất · Đóng', d: 'Hồ sơ đã kết thúc xử lý, xem kết luận trong chi tiết hồ sơ.' }\n      ];\nconst STEP_SHORT = ['Email thông báo', 'Đăng nhập OTP', 'Bảo hiểm của tôi', 'Chọn quyền lợi', 'Gửi hồ sơ', 'Nhận tiền'];\n\nfunction faqData(N) {\n  return [\n    { t: 'Điều kiện & mua bảo hiểm', s: 'Ai được mua, mua khi nào, chuyến bay nào được bảo hiểm, phí, hủy & hoàn phí', items: [\n      ['Phí bảo hiểm GoCare là bao nhiêu? Nếu tôi đặt vé khứ hồi thì phí bảo hiểm được tính như thế nào?', ['Phí bảo hiểm GoCare là 38.500 VND / khách / chiều bay. Đối với hành trình khứ hồi, mỗi chiều bay được bảo hiểm và tính phí riêng, tổng phí là 77.000 VND / khách.', 'Mỗi chiều bay đủ điều kiện bồi thường được chi trả độc lập 1.000.000 VND / khách, không phụ thuộc vào chiều bay còn lại.']],\n      ['Tôi có đủ điều kiện tham gia bảo hiểm không?', ['Bảo hiểm PVI bảo hiểm cho công dân Việt Nam hoặc người nước ngoài cư trú hợp pháp tại Việt Nam, từ 02 đến 85 tuổi tại thời điểm bắt đầu thời hạn bảo hiểm, có tên trên Vé máy bay của Chuyến bay được bảo hiểm.']],\n      ['Tôi mua bảo hiểm trước giờ khởi hành 24 giờ nhưng không kèm theo vé máy bay được không? Mua sau khi máy bay đã cất cánh thì sao?', ['Không được. Quý khách bắt buộc phải mua bảo hiểm trước ít nhất 24 giờ so với Thời gian khởi hành theo lịch trình. Đồng thời, Quý khách cần có tên trên vé máy bay và thông tin giấy tờ tùy thân dùng để mua bảo hiểm phải trùng khớp với thông tin mua vé.']],\n      ['Bố tôi 86 tuổi và con tôi 1 tuổi có được tham gia bảo hiểm này không?', ['Không được. Chương trình bảo hiểm chỉ áp dụng cho Người được bảo hiểm trong độ tuổi từ 02 đến 85 tuổi. Do đó, người thân của Quý khách 1 tuổi và 86 tuổi không thuộc đối tượng bảo hiểm.']],\n      ['Con tôi dưới 12 tuổi có được bảo hiểm không?', ['Có. Bảo hiểm PVI bảo hiểm cho trẻ dưới 12 tuổi khi đi cùng một người từ 18 tuổi trở lên, được ủy quyền hợp pháp và được bảo hiểm trong cùng một Hợp đồng / Giấy chứng nhận bảo hiểm.']],\n      ['Bé nhà tôi 10 tuổi đi máy bay một mình thì có mua được bảo hiểm không?', ['Không được. Trẻ em dưới 12 tuổi bắt buộc phải đi cùng một người từ 18 tuổi trở lên (được ủy quyền hợp pháp) và phải tham gia trong cùng một Hợp đồng / Giấy chứng nhận bảo hiểm với người đi kèm.']],\n      ['Tôi là người nước ngoài đang làm việc tại Việt Nam thì có mua được bảo hiểm này không?', ['Được. Quý khách là người nước ngoài cư trú hợp pháp tại Việt Nam, từ 02 đến 85 tuổi và có tên trên vé máy bay đều thuộc đối tượng được tham gia bảo hiểm.']],\n      ['Chuyến bay nào của tôi được bảo hiểm?', ['Bảo hiểm PVI áp dụng cho Chuyến bay theo lịch trình đặt qua Gotadi, được ghi nhận trên Hợp đồng / Giấy chứng nhận bảo hiểm.']],\n      ['Tôi đi chuyến bay thuê chuyến (charter) hoặc máy bay tư nhân thì có được bảo hiểm trễ chuyến không?', ['Không được. Bảo hiểm loại trừ trách nhiệm đối với các sự cố chậm trễ hoặc gián đoạn trên chuyến bay thuê bao, cho thuê, khai thác cá nhân hoặc chuyến bay không theo lịch trình.']],\n      ['Tôi muốn hủy hợp đồng bảo hiểm đã mua thì có được hoàn phí không?', ['Quý khách được hoàn trả 100% phí bảo hiểm đã đóng, nếu văn bản đề nghị chấm dứt Hợp đồng / Giấy chứng nhận bảo hiểm được gửi trước Thời gian khởi hành theo lịch trình ít nhất 24 giờ. Mức hoàn phí này áp dụng không phân biệt bên đề nghị chấm dứt là Quý khách hay Bảo hiểm PVI.', 'Nếu Quý khách đề nghị chấm dứt khi thời gian còn lại dưới 24 giờ so với Thời gian khởi hành, Bảo hiểm PVI không hoàn trả bất cứ khoản phí bảo hiểm nào. Sau khi Hợp đồng chấm dứt, Bảo hiểm PVI cũng không chịu trách nhiệm với bất kỳ yêu cầu bồi thường nào.']],\n      ['Tôi mua 2 hợp đồng bảo hiểm trễ chuyến của PVI cho cùng một chuyến bay thì có được nhận gấp đôi tiền không?', ['Không. Nếu Quý khách tham gia nhiều hơn 01 hợp đồng bảo hiểm PVI cho cùng một chuyến bay, Bảo hiểm PVI chỉ chi trả theo 01 Hợp đồng duy nhất. Hệ thống xét duyệt tự động sẽ loại các yêu cầu bồi thường trùng lặp.']]\n    ]},\n    { t: 'Quyền lợi & cách tính trễ', s: 'Mốc 120 phút, số tiền chi trả, mốc giờ nào được dùng để tính', items: [\n      ['Chuyến bay trễ tối thiểu bao lâu thì đủ điều kiện bồi thường và tôi nhận được bao nhiêu tiền?', ['Thời gian trì hoãn tối thiểu để phát sinh quyền lợi bảo hiểm là 120 phút (02 tiếng), áp dụng với tất cả các Hãng hàng không. Khi đạt đủ điều kiện trễ này, Quý khách được chi trả Số tiền bảo hiểm 1.000.000 VND / chuyến / người.']],\n      ['Chuyến bay của tôi bị trễ 60 phút hoặc 90 phút thì có được nhận tiền bảo hiểm không?', ['Không được chi trả. Bảo hiểm loại trừ trách nhiệm đối với các chuyến bay có thời gian chậm dưới mức tối thiểu. Theo Giấy chứng nhận bảo hiểm, thời gian trì hoãn phải đạt từ 120 phút trở lên.']],\n      ['Thời gian trễ chuyến bay được tính chính xác từ lúc nào đến lúc nào?', ['Thời gian trễ được tính từ “Thời gian khởi hành theo lịch trình” đến “Thời gian khởi hành thực tế”, là thời điểm máy bay bắt đầu lăn bánh di chuyển ra đường bay để cất cánh, của Chuyến bay được bảo hiểm hoặc Chuyến bay thay thế, tùy thời điểm nào đến trước.', 'Thời gian khởi hành theo lịch trình là: (i) thời gian khởi hành ban đầu của chuyến bay như đã nêu trên Vé máy bay tại thời điểm mua; hoặc (ii) thời gian khởi hành được cập nhật từ Hãng hàng không ít nhất 24 giờ trước thời gian khởi hành ban đầu, tùy thời gian nào đến sau sẽ được áp dụng.']],\n      ['Căn cứ vào đâu để xác định chính xác giờ máy bay cất cánh thực tế?', ['Giờ cất cánh thực tế được xác định căn cứ vào hệ thống FlightRadar24. Trường hợp có sai lệch giữa các nguồn dữ liệu, dữ liệu của FlightRadar24 được ưu tiên sử dụng làm căn cứ chính thức để xét duyệt bồi thường.']],\n      ['Tôi có phải tự chứng minh giờ bay thực tế không?', ['Với chuyến bay ban đầu: Quý khách không cần tự chứng minh. Bảo hiểm PVI xác minh tự động căn cứ dữ liệu do Tổ chức cung cấp dữ liệu chuyến bay (FlightRadar24) công bố, theo quy định tại Hợp đồng / Giấy chứng nhận bảo hiểm.', 'Với chuyến bay thay thế bởi Hãng hàng không hoặc Gotadi: Quý khách vui lòng lựa chọn Quyền lợi Chuyến bay thay thế và cung cấp bổ sung thông tin Chuyến bay mới để Bảo hiểm PVI có cơ sở ghi nhận cho bộ hồ sơ bồi thường.']],\n      ['Hãng hàng không thông báo đổi giờ bay hoặc đổi chuyến thì mốc tính trễ theo giờ cũ hay giờ mới?', ['Mốc tính trễ được xác định căn cứ vào thời điểm Hãng hàng không thông báo cho Người được bảo hiểm, cụ thể:', '(i) Trường hợp Hãng hàng không thông báo ít nhất 24 giờ trước thời gian khởi hành ban đầu: thời gian khởi hành mới được xem là Thời gian khởi hành theo lịch trình. Thời gian trễ được tính từ thời gian khởi hành mới này.', '(ii) Trường hợp Hãng hàng không thông báo trong vòng 24 giờ trước thời gian khởi hành ban đầu: Thời gian khởi hành theo lịch trình vẫn là thời gian khởi hành ban đầu trên Vé máy bay. Thời gian trễ được tính từ thời gian khởi hành ban đầu.']]\n    ]},\n    { t: 'Tình huống thực tế', s: 'Trễ, hủy, đổi chuyến và các trường hợp không được chi trả', items: [\n      ['Chuyến bay của tôi bị hủy và được Hãng xếp chuyến khác, tôi có được bồi thường không?', ['Có. Bảo hiểm PVI vẫn chi trả nếu đó là Chuyến bay thay thế do Hãng hàng không hoặc Gotadi thu xếp, cùng Nơi đi, Nơi đến và Mã đặt chỗ, và thời gian trễ đạt từ 120 phút trở lên. Trường hợp chuyến bay được đổi theo yêu cầu riêng của Quý khách, quyền lợi không được áp dụng.', 'Thời gian trễ được tính từ Thời gian khởi hành theo lịch trình, xác định căn cứ vào thời điểm Hãng hàng không thông báo đổi chuyến (trong vòng 24 giờ hoặc ít nhất 24 giờ trước thời gian khởi hành ban đầu), như ví dụ tại câu hỏi tiếp theo.']],\n      ['Chuyến ban đầu 07h00, Hãng báo đổi sang chuyến thay thế 12h00. Thời gian trễ tính từ mốc nào?', ['Thời gian khởi hành theo lịch trình được xác định căn cứ vào thời điểm Hãng hàng không thông báo cho Người được bảo hiểm, cụ thể:', '(i) Trường hợp Hãng hàng không thông báo trong vòng 24 giờ trước thời gian khởi hành ban đầu (07h00): Thời gian khởi hành theo lịch trình là 07h00. Chuyến bay thay thế có Thời gian khởi hành thực tế lúc 12h00, thời gian trễ là 05 giờ, thuộc phạm vi bồi thường.', '(ii) Trường hợp Hãng hàng không thông báo ít nhất 24 giờ trước thời gian khởi hành ban đầu (07h00): Thời gian khởi hành theo lịch trình là 12h00. Chuyến bay chỉ thuộc phạm vi bồi thường khi Thời gian khởi hành thực tế từ 14h00 trở đi (trễ từ 120 phút trở lên so với 12h00).', 'Người được bảo hiểm cần lưu giữ thông báo thay đổi chuyến bay của Hãng hàng không (email/SMS thể hiện rõ thời điểm gửi) làm căn cứ giải quyết bồi thường.']],\n      ['Chuyến bay lịch trình cất cánh 09h00, thực tế máy bay bắt đầu lăn bánh lúc 11h00. Trễ đúng 2 tiếng thì có được bồi thường?', ['Quý khách được bồi thường. Theo Giấy chứng nhận bảo hiểm, thời gian trì hoãn tối thiểu để phát sinh quyền lợi là 120 phút. Chuyến bay của Quý khách trễ đúng 120 phút (từ 09h00 đến 11h00) nên đã đủ điều kiện nhận bồi thường.']],\n      ['Hãng thông báo trễ 3 tiếng, do sốt ruột nên tôi tự đổi mua vé sang chuyến bay khác. Tôi có được bồi thường không?', ['Quý khách không được bồi thường. Chuyến bay thay thế không áp dụng cho trường hợp Quý khách tự ý đổi vé hoặc tự thu xếp mua vé mới. Việc tự đổi vé thuộc điểm loại trừ do không lên máy bay theo đúng lịch trình đã mua.']],\n      ['Những trường hợp nào tôi không được chi trả?', ['Bảo hiểm PVI không chi trả trong bốn nhóm trường hợp: chuyến bay không hợp lệ; sự kiện bất khả kháng & an ninh; lỗi hoặc hành vi của hành khách; và không đủ căn cứ chi trả. Quý khách xem danh sách đầy đủ tại tab Loại trừ.']],\n      ['Tôi bị trễ chuyến bay do kẹt xe nên đến sân bay muộn, làm thủ tục muộn thì bảo hiểm có trả tiền không?', ['Không được bồi thường. Việc Quý khách đến sân bay muộn dẫn đến không đăng ký lên máy bay hoặc không lên máy bay theo lịch trình thuộc điều khoản loại trừ trách nhiệm bảo hiểm.']]\n    ]},\n    { t: 'Hồ sơ & nhận tiền', s: 'Giấy tờ cần có, cách khai báo trên Cổng, thời hạn và tài khoản nhận tiền', items: [\n      ['Ai là đơn vị tiếp nhận và xử lý hồ sơ bồi thường?', ['Yêu cầu bồi thường được tiếp nhận và xử lý trực tuyến trên Cổng bồi thường do Igloo vận hành. Igloo là đối tác TPA (đơn vị quản lý bồi thường) của Bảo hiểm PVI, hỗ trợ hệ thống Cổng bồi thường và được PVI ủy quyền chi trả bồi thường cho Quý khách.', 'Các email thông báo sự kiện bồi thường, tiếp nhận hồ sơ, yêu cầu bổ sung và kết quả xử lý đều được gửi từ hệ thống của Igloo. Hỗ trợ bồi thường: claim.vn@iglooinsure.com.', 'Quyền lợi và trách nhiệm chi trả vẫn thuộc Công ty Bảo hiểm PVI Thủ Đô theo Hợp đồng / Giấy chứng nhận bảo hiểm.']],\n      ['Quy trình xử lý hồ sơ bồi thường tự động diễn ra như thế nào?', ['Khi FlightRadar24 ghi nhận chuyến bay trễ từ 120 phút, hệ thống tự động gửi email kèm đường dẫn khai báo cho Quý khách. Sau khi Quý khách nộp hồ sơ, hệ thống đối chiếu dữ liệu tên, chuyến bay và số tài khoản. Nếu hợp lệ, hồ sơ chuyển sang trạng thái “Được chấp thuận chi trả”. Trường hợp có đổi chuyến, hồ sơ sẽ chuyển sang xử lý thủ công.']],\n      ['Hồ sơ yêu cầu bồi thường bao gồm những gì và nộp ở đâu?', ['Hồ sơ gồm: Giấy yêu cầu trả tiền bảo hiểm; ảnh chụp giấy tờ tùy thân (CMND / CCCD hoặc Hộ chiếu); vé máy bay hoặc thẻ lên máy bay của chuyến bay ban đầu; xác nhận thay đổi / hoãn / hủy chuyến từ Hãng hàng không (nếu có); tài khoản ngân hàng nhận tiền; và email đã đăng ký với hợp đồng để nhận mã OTP.', 'Quý khách nộp trực tuyến qua Cổng bồi thường bằng cách nhấp đường dẫn trong email hoặc quét mã QR trên Giấy chứng nhận bảo hiểm. Bảo hiểm PVI tiếp nhận chứng từ dưới dạng ảnh chụp hoặc bản scan, chi tiết tại tab Bồi thường.']],\n      ['Tôi khai báo ở đâu và có phải nộp hồ sơ giấy không?', ['Quý khách khai báo trực tuyến trên Cổng bồi thường, truy cập bằng đường dẫn trong email Bảo hiểm PVI gửi tự động hoặc quét mã QR tại tab Bồi thường. Bảo hiểm PVI không yêu cầu nộp hồ sơ giấy.']],\n      ['Tôi đăng nhập Cổng bồi thường bằng cách nào?', ['Quý khách đăng nhập bằng email đã đăng ký với hợp đồng; hệ thống gửi mã OTP về chính hộp thư đó để xác thực. Bảo hiểm PVI không yêu cầu Quý khách tạo mật khẩu riêng.']],\n      ['Tôi chưa nhận được email thông báo thì phải làm gì?', ['Quý khách vui lòng kiểm tra hộp thư rác / quảng cáo trước. Quý khách cũng có thể chủ động mở Cổng bồi thường bằng mã QR hoặc nút tại tab Bồi thường và đăng nhập bằng email đã đăng ký. Nếu vẫn chưa thấy hợp đồng, vui lòng liên hệ Bảo hiểm PVI qua hotline hoặc email hỗ trợ.']],\n      ['Tôi có bao lâu để nộp hồ sơ và khi nào thì nhận được tiền?', ['Quý khách có tối đa 01 năm kể từ ngày xảy ra sự kiện bảo hiểm để nộp và bổ sung hồ sơ. Sau khi Quý khách cung cấp đầy đủ hồ sơ hợp lệ, số tiền bồi thường được chuyển khoản trực tiếp vào tài khoản ngân hàng của Quý khách trong vòng 07 ngày làm việc.']],\n      ['Chuyến bay của tôi trễ đủ điều kiện nhưng tôi quên không gửi yêu cầu bồi thường ngay lúc đó thì có mất quyền lợi không?', ['Quý khách không mất quyền lợi ngay. Khi hệ thống ghi nhận chuyến bay trễ từ 120 phút trở lên, email thông báo kèm đường dẫn / mã QR bồi thường được gửi tự động cho Quý khách. Thời hạn để truy cập và hoàn thiện hồ sơ là 01 năm kể từ ngày xảy ra sự kiện trễ chuyến.', 'Tuy nhiên, nếu Quý khách để quá thời hạn 01 năm này mà không có lý do bất khả kháng hợp lệ, Bảo hiểm PVI có quyền từ chối chi trả bồi thường.']],\n      ['Tôi đặt vé cho nhiều người trong cùng một booking, tôi khai báo thế nào?', ['Trên Cổng bồi thường sẽ hiển thị hồ sơ bồi thường theo từng khách hàng. Quý khách vui lòng khai báo lần lượt cho từng người để đảm bảo rõ ràng về thông tin và có cơ sở cho Bảo hiểm PVI tiếp nhận hồ sơ đầy đủ.']],\n      ['Tôi mua bảo hiểm cho cả gia đình, tôi có thể đại diện làm hồ sơ và nhận toàn bộ tiền vào tài khoản của tôi không?', ['Với con nhỏ dưới 18 tuổi (bao gồm trẻ dưới 12 tuổi): Quý khách, với tư cách cha / mẹ hoặc người giám hộ hợp pháp đi cùng trong Hợp đồng, hoàn toàn được đại diện kê khai và nhận tiền bồi thường trực tiếp vào tài khoản ngân hàng của mình.', 'Với người thân đã trưởng thành (vợ / chồng, bố mẹ): Hệ thống bồi thường tự động sẽ đối chiếu tên chủ tài khoản ngân hàng với tên từng Người được bảo hiểm. Do đó, tiền bồi thường nên được chuyển vào tài khoản chính chủ của từng người. Trường hợp Quý khách muốn nhận thay cho toàn bộ người lớn trong gia đình, hồ sơ cần có văn bản ủy quyền hợp pháp để chuyển bộ phận giải quyết thủ công.']],\n      ['Tôi mua vé và bảo hiểm cho nhóm bạn bè hoặc đồng nghiệp đi chung, tôi có thể nhận thay toàn bộ tiền bồi thường không?', ['Quý khách không nên nhận toàn bộ tiền vào tài khoản cá nhân qua hệ thống tự động, vì hệ thống sẽ đối chiếu tên chủ tài khoản ngân hàng khớp với tên từng Người được bảo hiểm. Với bạn bè, đồng nghiệp (người lớn độc lập), mỗi cá nhân nên cung cấp số tài khoản chính chủ của mình trên Cổng bồi thường để được duyệt chi trả tự động nhanh chóng.', 'Nếu Quý khách muốn đại diện nhận thay cho cả nhóm, hồ sơ sẽ phải xử lý thủ công và bắt buộc cung cấp thêm Giấy ủy quyền hợp pháp từ từng người.']],\n      ['Tôi theo dõi tiến độ hồ sơ ở đâu?', ['Quý khách theo dõi tại mục “Các yêu cầu bồi thường” trên Cổng bồi thường, với ba trạng thái: Đang xử lý, Đang xử lý thanh toán, Hoàn tất · Đóng.']]\n    ]}\n  ];\n}\n\nclass Component extends DCLogic {\n  state = { dt: 0, age: 30, nat: 0, onTicket: 0, accomp: 0, defIdx: 0, docsOn: [false, false, false, false, false], stepIdx: 0, stIdx: 0, tab: null, bt: 0, fg: 0, open: null, w: typeof window !== 'undefined' ? window.innerWidth : 1280, hero: 0, panelIn: true };\n  scrollRef = React.createRef();\n  mobTabsRef = React.createRef();\n  componentDidUpdate() { const el = this.mobTabsRef.current; if (!el) return; const a = el.querySelector('[data-active=\"1\"]'); if (a && this._lastTab !== this.state.tab) { this._lastTab = this.state.tab; el.scrollTo({ left: Math.max(0, a.offsetLeft - 16), behavior: 'smooth' }); } }\n  timers = [];\n\n  componentDidMount() {\n    this.onResize = () => this.setState({ w: window.innerWidth });\n    window.addEventListener('resize', this.onResize);\n    let saved = null;\n    try { saved = localStorage.getItem('flycare_gotadi_tab'); } catch (e) {}\n    let qTab = null;\n    try { qTab = new URLSearchParams(window.location.search).get('tab'); } catch (e) {}\n    const start = qTab || saved || this.props.defaultTab || 'home';\n    this.go(start, true);\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this.onResize); this.timers.forEach(clearTimeout); }\n\n  runHero() {\n    this.timers.forEach(clearTimeout); this.timers = [];\n    this.setState({ hero: 0 });\n    [[200, 1], [800, 2], [1200, 3], [1400, 4]].forEach(([ms, v]) => this.timers.push(setTimeout(() => this.setState({ hero: v }), ms)));\n  }\n\n  go(id, initial) {\n    if (!initial && id === this.state.tab) return;\n    try { localStorage.setItem('
